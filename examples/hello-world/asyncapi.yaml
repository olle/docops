asyncapi: 3.0.0
info:
  title: Hello World Events
  version: 0.1.0
  description: Events emitted by the Hello World example.
channels:
  greetings:
    address: greetings
    messages:
      greeting:
        payload:
          type: object
          required:
            - message
          properties:
            message:
              type: string
operations:
  publishGreeting:
    action: send
    channel:
      $ref: '#/channels/greetings'
